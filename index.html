<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>縦書きセリフ帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="セリフ帳">
<meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181e" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('tategaki-theme');if(t==='night')t='dark';if(t&&t!=='auto')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=34">
<script type="module" src="js/main.js?v=34"></script>
</head>
<body>
<!-- iOS の「連絡先を自動入力」を抑えるため、入力欄を自動入力オフのフォームに入れる（送信はしない） -->
<form id="root" autocomplete="off" novalidate onsubmit="return false">
<div id="app">
  <header>
    <h1 id="title" class="vh">縦書きセリフ帳</h1>
    <span id="hdr"></span>
  </header>
  <main id="listview" hidden></main>
  <div id="editview" hidden>
    <div id="pos"><div class="track" aria-hidden="true"></div><span class="pg" aria-hidden="true"></span><span class="sync" role="status"></span></div>
    <div id="canvas" aria-label="ノート"><div id="sheet"></div></div>
    <div id="bar"></div>
    <!-- キーボードが出ている間だけ出す「完了」（iPad のキーボードには iPhone のような ✓ がないため） -->
    <button type="button" id="kbdone">完了</button>
    <!-- カーソルを1字ずつ動かす（iOS の縦書きの入力欄は、タップでカーソルを狙った字の間に置きにくい） -->
    <button type="button" id="kbyoko" class="kbmove" aria-label="横書きで直す">横</button>
    <button type="button" id="kbup" class="kbmove" aria-label="カーソルを前の字へ">▲</button>
    <button type="button" id="kbdn" class="kbmove" aria-label="カーソルを次の字へ">▼</button>
  </div>
</div>
<div id="toast" role="status"></div>
<!-- iOS 26 のすりガラスのぼかし対策（試し）：画面の上端・下端に無地の帯を置く -->
<div id="edge-top" aria-hidden="true"></div><div id="edge-bottom" aria-hidden="true"></div>
<div id="layer"></div>
</form>
</body>
</html>
